<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Wellbore Schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1a1a;--surface:#122626;--surface-alt:#183030;--accent:#00e5a0;--accent-dim:#00e5a033;--accent2:#00b8ff;--accent3:#f7c948;--text:#e8f0f0;--text-dim:#8fa8a8;--red:#ff6b6b;--plug:#2d7a4f;--font-d:'Space Grotesk',sans-serif;--font-b:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);line-height:1.5;overflow:hidden;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;padding:.75rem 1.25rem;background:var(--surface);border-bottom:1px solid #1e3a3a;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.55rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid #00e5a044;border-radius:999px;padding:.15rem .6rem}
.badge .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-l h1{font-family:var(--font-d);font-size:.95rem;font-weight:700}
.hdr-l h1 span{color:var(--accent);font-weight:400;font-size:.75rem;margin-left:.25rem}
.hdr-r{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.utog{display:flex;background:var(--bg);border:1px solid #1e3a3a;border-radius:6px;overflow:hidden}
.utog button{font-family:var(--font-d);font-size:.6rem;font-weight:600;padding:.3rem .6rem;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .2s}
.utog button.on{background:var(--accent);color:var(--bg)}
.utog button:hover:not(.on){color:var(--text)}
.ebtn{font-family:var(--font-d);font-size:.6rem;font-weight:600;padding:.3rem .7rem;border:1px solid #1e3a3a;border-radius:6px;background:var(--bg);color:var(--text-dim);cursor:pointer;transition:all .2s}
.ebtn:hover{border-color:var(--accent3);color:var(--accent3)}
.ebtn.on{background:var(--accent3);color:var(--bg);border-color:var(--accent3)}

/* ── TABS ── */
.tabs{display:flex;align-items:center;gap:.25rem;padding:0 1.25rem;background:var(--bg);border-bottom:1px solid #1e3a3a;flex-shrink:0;flex-wrap:wrap}
.tab{font-family:var(--font-d);font-size:.68rem;font-weight:600;padding:.5rem .75rem;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab span{font-weight:400;font-size:.58rem;color:var(--text-dim);margin-left:.35rem}
.chips{display:flex;align-items:center;gap:.3rem;margin-left:auto;flex-wrap:wrap;padding:.3rem 0}
.chip{font-family:var(--font-d);font-size:.58rem;font-weight:600;padding:.22rem .55rem;border:1px solid #1e3a3a;border-radius:999px;background:var(--surface);color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip b{color:var(--text);font-weight:600;margin-right:.3rem}
.chip:hover{border-color:var(--accent2);color:var(--text)}
.chip.on{border-color:var(--accent2);background:#00b8ff1a;color:var(--accent2)}
.chip.on b{color:var(--accent2)}

/* ── WELL RECORD ── */
.rr{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px solid #152020;font-size:.66rem}
.rr:last-child{border-bottom:none}
.rr .rl{color:var(--text-dim);white-space:nowrap;flex-shrink:0}
.rr .rv{color:var(--text);text-align:right}
.dn-t{font-family:var(--font-d);font-size:.5rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent3);margin:.45rem 0 .2rem;padding-top:.3rem;border-top:1px solid #1a2e2e}
.dn{list-style:none;display:flex;flex-direction:column;gap:.2rem}
.dn li{font-size:.62rem;color:var(--text-dim);line-height:1.35;padding-left:.6rem;position:relative}
.dn li::before{content:'';position:absolute;left:0;top:.45em;width:4px;height:4px;border-radius:50%;background:var(--accent3)}
.leg-s.br{width:7px;height:11px;border:2px solid;border-right:none;border-radius:0;background:transparent;margin-right:6px}
#wsbtns{display:flex;gap:.3rem}

/* ── MAIN LAYOUT ── */
.main{flex:1;display:grid;grid-template-columns:1fr 380px;gap:0;padding:0;overflow:hidden;min-height:0}

/* ── SVG PANEL ── */
.svg-p{background:var(--surface);border-right:1px solid #1e3a3a;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.svg-box{flex:1;overflow:hidden;cursor:grab;position:relative;background:linear-gradient(180deg,#0a1414 0%,#0d1919 100%);min-height:400px;display:flex;align-items:stretch}
.svg-box:active{cursor:grabbing}
.svg-box svg{display:block;width:100%;height:100%}
.svg-box.edit{cursor:crosshair;box-shadow:inset 0 0 0 2px var(--accent3)}
.svg-tools{display:flex;align-items:center;gap:.5rem;margin-top:0;padding:.5rem .75rem;border-top:1px solid #1a2e2e;background:var(--surface);flex-wrap:wrap}
.ds{display:flex;align-items:center;gap:.3rem}
.ds input{font-family:var(--font-b);font-size:.7rem;padding:.3rem .5rem;background:var(--bg);border:1px solid #1e3a3a;border-radius:4px;color:var(--text);width:110px;outline:none}
.ds input:focus{border-color:var(--accent)}
.ds input::placeholder{color:var(--text-dim)}
.ds button,.zb{font-family:var(--font-d);font-size:.6rem;font-weight:600;padding:.3rem .5rem;border:none;border-radius:4px;cursor:pointer;transition:all .15s}
.ds button{background:var(--accent);color:var(--bg)}
.ds button:hover{opacity:.85}
.zb{background:var(--surface);border:1px solid #1e3a3a;color:var(--text-dim)}
.zb:hover{border-color:var(--accent);color:var(--accent)}
.zl{font-family:var(--font-d);font-size:.6rem;font-weight:600;color:var(--text-dim);min-width:36px;text-align:center}

/* ── SIDE PANEL ── */
.side{display:flex;flex-direction:column;gap:0;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:#1e3a3a transparent;background:var(--surface)}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb{background:#1e3a3a;border-radius:3px}
.pnl{border-bottom:1px solid #1e3a3a;padding:.65rem;flex-shrink:0}
.pnl:last-child{border-bottom:none}
.pnl-t{font-family:var(--font-d);font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem;display:flex;align-items:center;justify-content:space-between}
.pnl-t .hint{font-size:.5rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-dim)}

/* ── LEGEND ── */
.leg-sec{margin-bottom:.4rem}
.leg-sec:last-child{margin-bottom:0}
.leg-sec-t{font-family:var(--font-d);font-size:.5rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:0 .3rem .15rem;border-bottom:1px solid #1a2e2e;margin-bottom:.1rem}
.leg-i{display:flex;align-items:center;gap:.45rem;padding:.25rem .35rem;border-radius:4px;cursor:pointer;transition:background .12s;user-select:none}
.leg-i:hover{background:var(--surface-alt)}
.leg-i.dim{opacity:.25}
.leg-i.dim .leg-l{text-decoration:line-through}
.leg-s{width:18px;height:7px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.leg-s.ln{width:18px;height:0;border-top:2px solid;border-radius:0}
.leg-s.da{width:18px;height:0;border-top:2px dashed;border-radius:0}
.leg-s.dm{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);margin:0 4px}
.leg-s.dd{width:18px;height:4px;background:repeating-linear-gradient(90deg,currentColor 0px,currentColor 2px,transparent 2px,transparent 5px);border:none}
.leg-l{font-size:.7rem;color:var(--text)}

/* ── PROPERTY EDITOR ── */
.prop{display:none}
.prop.vis{display:block}
.prop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;padding-bottom:.3rem;border-bottom:1px solid #1a2e2e}
.prop-title{font-family:var(--font-d);font-size:.72rem;font-weight:700;color:var(--accent3)}
.prop-x{width:20px;height:20px;border-radius:4px;border:1px solid #1e3a3a;background:transparent;color:var(--text-dim);font-size:.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.prop-x:hover{border-color:var(--red);color:var(--red)}
.pf{display:flex;align-items:center;padding:.2rem 0;gap:.4rem}
.pf label{font-size:.68rem;color:var(--text-dim);min-width:80px;flex-shrink:0}
.pf input,.pf select{font-family:var(--font-d);font-size:.7rem;font-weight:500;color:var(--text);background:var(--bg);border:1px solid #1e3a3a;border-radius:4px;padding:.25rem .4rem;flex:1;min-width:0;outline:none}
.pf input:focus,.pf select:focus{border-color:var(--accent3)}
.pf select{cursor:pointer}
.pf textarea{font-family:var(--font-b);font-size:.68rem;color:var(--text);background:var(--bg);border:1px solid #1e3a3a;border-radius:4px;padding:.25rem .4rem;flex:1;min-width:0;outline:none;resize:vertical;min-height:28px}
.pf textarea:focus{border-color:var(--accent3)}
.pact{display:flex;gap:.25rem;margin-top:.4rem;padding-top:.3rem;border-top:1px solid #1a2e2e}
.pab{flex:1;font-family:var(--font-d);font-size:.55rem;font-weight:600;padding:.3rem;border-radius:4px;border:1px solid #1e3a3a;background:var(--surface-alt);color:var(--text-dim);cursor:pointer;text-align:center;transition:all .15s}
.pab:hover{border-color:var(--accent);color:var(--accent)}
.pab.del{border-color:#5a2020;color:var(--red)}
.pab.del:hover{background:#3a1515;border-color:var(--red)}

/* ── COMPONENT LIST ── */
.clist{max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1e3a3a transparent;margin-top:.2rem}
.ci{display:flex;align-items:center;gap:.35rem;padding:.2rem .3rem;border-radius:4px;cursor:pointer;transition:background .1s;font-size:.68rem;border:1px solid transparent}
.ci:hover{background:var(--surface-alt);border-color:#1e3a3a}
.ci.sel{background:var(--surface-alt);border-color:var(--accent3)}
.ci .sw{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ci .nm{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .dp{color:var(--text-dim);font-family:var(--font-d);font-size:.6rem;flex-shrink:0}
.addb{width:100%;font-family:var(--font-d);font-size:.55rem;font-weight:600;padding:.25rem;border:1px dashed #1e3a3a;border-radius:4px;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s;margin-top:.2rem}
.addb:hover{border-color:var(--accent);color:var(--accent)}

/* ── FORMATIONS EDITOR ── */
.frow{display:flex;align-items:center;gap:.3rem;padding:.2rem 0;border-bottom:1px solid #152020}
.frow:last-child{border-bottom:none}
.frow .fn{flex:1;min-width:0}
.frow .fn input{width:100%;font-family:var(--font-b);font-size:.68rem;color:var(--text);background:var(--bg);border:1px solid #1e3a3a;border-radius:3px;padding:.2rem .3rem;outline:none}
.frow .fn input:focus{border-color:var(--accent3)}
.frow .fd{width:70px;flex-shrink:0}
.frow .fd input{width:100%;font-family:var(--font-d);font-size:.68rem;font-weight:600;color:var(--accent);background:var(--bg);border:1px solid #1e3a3a;border-radius:3px;padding:.2rem .3rem;text-align:right;outline:none}
.frow .fd input:focus{border-color:var(--accent3)}
.frow .fu{width:18px;font-size:.5rem;color:var(--text-dim);text-align:center;flex-shrink:0}
.frow .fb{width:18px;height:18px;border-radius:3px;border:1px solid #1e3a3a;background:transparent;color:var(--text-dim);font-size:.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.frow .fb:hover{border-color:var(--red);color:var(--red)}
.frow .fb.dup:hover{border-color:var(--accent);color:var(--accent)}
.frow .fm{width:14px;height:14px;border-radius:2px;flex-shrink:0;cursor:grab}
.frow .fm:hover{opacity:.7}
.fadd{display:flex;gap:.3rem;margin-top:.3rem}
.fadd input{flex:1;font-family:var(--font-b);font-size:.65rem;padding:.25rem .35rem;background:var(--bg);border:1px solid #1e3a3a;border-radius:3px;color:var(--text);outline:none}
.fadd input:focus{border-color:var(--accent)}
.fadd input::placeholder{color:var(--text-dim)}
.fadd button{font-family:var(--font-d);font-size:.55rem;font-weight:600;padding:.25rem .5rem;border-radius:3px;border:1px solid #1e3a3a;background:var(--surface-alt);color:var(--text-dim);cursor:pointer;transition:all .12s;white-space:nowrap}
.fadd button:hover{border-color:var(--accent);color:var(--accent)}
.fhint{font-size:.5rem;color:var(--text-dim);text-align:center;padding:.15rem 0 0;opacity:.5}
.fdrag{position:absolute;z-index:10;pointer-events:none;opacity:.8;font-size:.6rem;font-weight:600;padding:.15rem .4rem;border-radius:3px;background:var(--accent3);color:var(--bg)}
.csec{font-size:.5rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:.2rem .2rem .1rem;border-bottom:1px solid #1a2e2e;margin-top:.3rem}
.csec:first-child{margin-top:0}

/* ── STATISTICS ── */
.sr{display:flex;justify-content:space-between;align-items:center;padding:.22rem 0;border-bottom:1px solid #152020}
.sr:last-child{border-bottom:none}
.sl{font-size:.68rem;color:var(--text-dim);white-space:nowrap}
.sv{font-family:var(--font-d);font-size:.72rem;font-weight:600;color:var(--accent);text-align:right}
.si{font-family:var(--font-d);font-size:.7rem;font-weight:600;color:var(--accent);background:var(--bg);border:1px solid #1e3a3a;border-radius:3px;padding:.2rem .35rem;width:80px;text-align:right;outline:none}
.si:focus{border-color:var(--accent)}
.si.si-t{width:100%;text-align:left;color:var(--text)}
.ssec{font-family:var(--font-d);font-size:.5rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);text-align:center;padding:.3rem 0 .1rem;border-top:1px solid #1a2e2e;margin-top:.15rem}
.shint{font-size:.5rem;color:var(--text-dim);text-align:center;padding:.2rem 0 0;opacity:.5}
.ws{display:flex;align-items:center;gap:.3rem;margin-bottom:.4rem;padding-bottom:.3rem;border-bottom:1px solid #1a2e2e}
.ws select{font-family:var(--font-b);font-size:.68rem;padding:.25rem .4rem;background:var(--bg);border:1px solid #1e3a3a;border-radius:4px;color:var(--text);outline:none;flex:1;cursor:pointer}
.ws select:focus{border-color:var(--accent)}
.ws button{font-family:var(--font-d);font-size:.55rem;font-weight:600;padding:.25rem .4rem;background:var(--surface-alt);border:1px solid #1e3a3a;border-radius:4px;color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap}
.ws button:hover{border-color:var(--accent);color:var(--accent)}
.ws button.bd:hover{border-color:var(--red);color:var(--red)}

/* ── TOOLTIP ── */
.tip{position:fixed;z-index:1000;background:#0f2020;border:1px solid #2a4a4a;border-radius:7px;padding:.5rem .65rem;pointer-events:none;opacity:0;transition:opacity .1s;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip.vis{opacity:1}
.tip-t{font-family:var(--font-d);font-size:.7rem;font-weight:700;color:var(--accent);margin-bottom:.15rem}
.tip-r{font-size:.65rem;color:var(--text-dim);line-height:1.3}
.tip-r strong{color:var(--text)}

/* ── EXPORT ── */
.xbar{display:flex;gap:.3rem;margin-top:.6rem;flex-wrap:wrap}
.xbtn{font-family:var(--font-d);font-size:.6rem;font-weight:600;padding:.35rem .7rem;background:var(--surface);border:1px solid #1e3a3a;border-radius:4px;color:var(--text-dim);cursor:pointer;transition:all .2s}
.xbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ── RESPONSIVE ── */
@media(max-width:1200px){.main{grid-template-columns:1fr 360px}}
@media(max-width:1024px){.main{grid-template-columns:1fr 320px}}
@media(max-width:900px){
  body{overflow:auto}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .svg-p{min-height:500px}
  .side{overflow-y:auto;max-height:none}
}
@media(max-width:600px){
  .hdr{padding:.5rem .75rem}
  .svg-p{min-height:420px}
}

/* ── PRINT / PDF ── */
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body{display:block;min-height:0}
  .hdr{background:#fff!important;border-bottom:2px solid #0c1a1a;padding:.5rem 0;margin-bottom:.5rem;display:flex!important}
  .hdr .badge{background:#f0f0f0!important;border-color:#ccc!important;color:#0c1a1a!important}
  .hdr .badge .dot{background:#0c1a1a!important;animation:none!important}
  .hdr-l h1{color:#000!important;font-size:14pt}
  .hdr-l h1 span{color:#333!important;font-size:11pt}
  .utog,.ebtn,.tip{display:none!important}
  .hdr-r{display:none!important}
  .main{display:block!important;overflow:visible!important;padding:0!important;gap:0!important}
  .svg-p{background:#fff!important;border:none!important;padding:0!important;margin-bottom:4mm;page-break-inside:avoid}
  .svg-box{background:#fff!important;min-height:auto!important;height:auto!important;cursor:default!important;overflow:visible!important}
  .svg-box svg{width:100%!important;height:auto!important;max-height:200mm}
  .svg-box svg text{fill:#000!important}
  .svg-box svg line,.svg-box svg rect,.svg-box svg polygon{stroke-width:1px!important}
  .svg-tools{display:none!important}
  .xbar{display:none!important}
  .side{display:block!important;overflow:visible!important;max-height:none!important}
  .pnl{background:#fff!important;border:1px solid #ddd!important;border-radius:4px!important;padding:4mm!important;margin-bottom:3mm;page-break-inside:avoid}
  .pnl-t{color:#0c1a1a!important;font-size:9pt;border-bottom:1px solid #ddd;padding-bottom:2mm;margin-bottom:2mm}
  .pnl-t .hint{display:none!important}
  .leg-i{padding:1mm 2mm}
  .leg-l{color:#000!important;font-size:8pt}
  .leg-s{border-color:#ccc!important}
  .sr{border-bottom-color:#eee!important;padding:1mm 0}
  .sl{color:#333!important;font-size:7.5pt}
  .sv{color:#0c1a1a!important;font-size:8pt}
  .si{background:#f8f8f8!important;border-color:#ccc!important;color:#000!important;font-size:8pt;padding:1mm 2mm}
  .prop{display:none!important}
  .frow{border-bottom-color:#eee!important;padding:1mm 0}
  .frow input{background:#f8f8f8!important;border-color:#ccc!important;color:#000!important;font-size:7.5pt}
  .fadd{display:none!important}
  .fhint{display:none!important}
  .ci{padding:1mm 2mm}
  .ci .nm{color:#000!important;font-size:7.5pt}
  .ci .dp{color:#555!important}
  .csec{color:#333!important;border-bottom-color:#ddd!important}
  .ws{display:none!important}
  .shint{display:none!important}
  .ssec{color:#333!important;border-top-color:#ddd!important}
  #ppnl{display:none!important}
  #dempty,#dcont{display:none!important}
  .pnl-t::after{display:none!important}
  .tabs{display:none!important}
  .rr .rl,.rr .rv{color:#000!important;font-size:7.5pt}
  .rr{border-bottom-color:#eee!important}
  .dn-t{color:#333!important;border-top-color:#ddd!important}
  .dn li{color:#333!important;font-size:7pt}
  .dn li::before{background:#333!important}
}
</style>
</head>
<body>

<div class="tip" id="tip"><div class="tip-t" id="tip-t"></div><div id="tip-b"></div></div>

<header class="hdr">
  <div class="hdr-l">
    <div class="badge"><span class="dot"></span>Wellbore Schematic</div>
    <h1 id="wname">Well <span id="wop"></span></h1>
  </div>
  <div class="hdr-r">
    <div class="utog">
      <button id="bm" class="on" onclick="setUnit('m')">Metric (m)</button>

function sh(){

function el(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}

function trunc(t,n){t=String(t||'');return t.length>n?t.slice(0,n-1)+'…':t}
// Labels are collected per column (L: left of bore, A: right of bore, B: far right)
// and laid out at the end so overlapping blocks are pushed apart and get leader lines.
function addLbl(col,y,lines,o){lbl[col].push(Object.assign({y,lines},o||{}))}
function drawLbls(g){
  const cfg={L:{x:LX,a:'end',lx:LX+4},A:{x:RX,a:'start',lx:RX-4},B:{x:FX,a:'end',lx:FX+3}};
  for(const col of ['L','A','B']){
    const c=cfg[col],items=lbl[col].sort((a,b)=>a.y-b.y);
    let floor=-1e9;
    items.forEach(it=>{it.h=it.lines.reduce((t,l)=>t+l.s*1.25,0);let top=it.y-it.h/2;if(top<floor)top=floor;it.top=top;floor=top+it.h+2});
    items.forEach(it=>{
      let yy=it.top;
      it.lines.forEach(l=>{const t=el('text',{x:c.x,y:(yy+l.s*.95).toFixed(1),'text-anchor':c.a,fill:l.f,'font-size':l.s,'font-weight':l.w||'400','font-family':l.ff||FB});t.textContent=l.t;g.appendChild(t);yy+=l.s*1.25});
      const cy=it.top+it.h/2;
      if(it.leader!==undefined&&(it.always||Math.abs(cy-it.y)>2))g.appendChild(el('line',{x1:it.leader,y1:it.y,x2:c.lx,y2:cy,stroke:it.lc||'#3a5a5a','stroke-width':'.5','stroke-dasharray':'2,2'}));
    });
  }
}

  // Defs
  const defs=el('defs',{});

  op.appendChild(el('rect',{width:'8',height:'8',fill:'#3a2a08'}));

    const ti=unit==='m'?50:100/M2F,me=unit==='m'?100:500/M2F;

    }

    if(W.totalDepth>ot){
      og.appendChild(el('rect',{x:BCX-BW/2,y:d2y(ot),width:BW,height:d2y(W.totalDepth)-d2y(ot),fill:'url(#ohP)',stroke:'#5a4a18','stroke-width':'1',rx:'2'}));
      addLbl('L',d2y(ot)+11,[{t:'Open Hole',s:8,f:'#b88a10',w:'600'},{t:`${fmtS(W.totalDepth-ot)}${uN()} · ${fmtS(ot)}–${fmtS(W.totalDepth)}${uN()}`,s:6.5,f:'#8a6a10'}]);
    }
    g.appendChild(og);
  }

  // Casings
  if(!hid.has('casings')){
    const cg=el('g',{});
    W.casings.forEach((c,i)=>{
      const w=CW[i]||24,y1=d2y(c.top),y2=d2y(c.shoe);
      const r=el('rect',{x:BCX-w/2,y:y1,width:w,height:y2-y1,fill:'#5a6a6a',stroke:'#8a9a9a','stroke-width':'1.5',rx:'1','data-t':'casing','data-i':String(i)});
      if(edit){r.style.cursor='ns-resize'}
      cg.appendChild(r);
      cg.appendChild(el('rect',{x:BCX-w/2-2,y:y2-3,width:w+4,height:6,fill:'#8a9a9a',rx:'2'}));
      addLbl('L',y1+(y2-y1)/2,[{t:c.name,s:8,f:'#8fa8a8'},{t:`${c.od} · ${c.grade}`,s:7,f:'#6a8888'}],{leader:BCX-w/2-2,always:true});
    });
    g.appendChild(cg);
  }

  // Cement (dashed + lighter when the top of cement is an estimate)
  if(!hid.has('cement')){
    const cmg=el('g',{});
    W.casings.forEach((c,i)=>{
      const w=CW[i]||24,cw=BW/2-w/2;if(cw<=0)return;
      const y1=d2y(c.cementTop),y2=d2y(c.shoe),est=!!c.cementEst;
      const ra={fill:'#4a9ebb',opacity:est?'.2':'.35',rx:'1'};
      if(est){ra.stroke='#4a9ebb';ra['stroke-width']='.6';ra['stroke-dasharray']='2,2'}
      cmg.appendChild(el('rect',Object.assign({x:BCX-BW/2,y:y1,width:cw,height:y2-y1},ra)));
      cmg.appendChild(el('rect',Object.assign({x:BCX+w/2,y:y1,width:cw,height:y2-y1},ra)));
      if(c.cementTop>0){
        cmg.appendChild(el('line',{x1:BCX-BW/2,y1:y1,x2:BCX+BW/2,y2:y1,stroke:'#4a9ebb','stroke-width':'1','stroke-dasharray':est?'1,2':'3,2'}));
        addLbl('L',y1,[{t:est?'TOC (est.)':'TOC',s:7,f:'#4a9ebb'}],{leader:BCX-BW/2-1,always:true,lc:'#4a9ebb'});
      }
    });
    g.appendChild(cmg);
  }

  // Plugs
  if(!hid.has('plugs')){
    const pg=el('g',{});
    W.plugs.forEach((p,i)=>{
      const yt=d2y(p.bottom),yb=d2y(p.top),ph=yb-yt;if(ph<=0)return;
      pg.appendChild(el('rect',{x:BCX-BW/2,y:yt-1,width:BW,height:ph+2,fill:'#2d7a4f',opacity:'.18',rx:'3'}));
      const r=el('rect',{x:BCX-BW/2+3,y:yt,width:BW-6,height:ph,fill:'#2d7a4f',stroke:'#4aba7a','stroke-width':'1.2',rx:'3','data-t':'plug','data-i':String(i)});
      if(edit)r.style.cursor='ns-resize';
      pg.appendChild(r);
      const ls=Math.max(3,ph/6);for(let ly=yt+ls;ly<yb;ly+=ls)pg.appendChild(el('line',{x1:BCX-BW/2+6,y1:ly,x2:BCX+BW/2-6,y2:ly,stroke:'#4aba7a','stroke-width':'.5',opacity:'.5'}));
      const my=yt+ph/2;
      if(ph>=9){const nm=el('text',{x:BCX,y:my+3,'text-anchor':'middle',fill:'#fff','font-family':FD,'font-size':'9','font-weight':'700'});nm.textContent=`P${p.id}`;pg.appendChild(nm)}
      const vol=[p.sacks?`${p.sacks} sacks`:'sacks n/r',p.additive&&p.additive!=='None'?p.additive:''].filter(Boolean).join(' · ');
      addLbl('A',my,[{t:`Plug ${p.id}`,s:8,f:'#4aba7a',w:'700',ff:FD},{t:`${fmt(p.top)} – ${fmt(p.bottom)}`,s:7,f:'#3a8a5a'},{t:vol,s:6.5,f:'#2d6a4f'}],{leader:BCX+BW/2,lc:'#2d7a4f'});
    });
    g.appendChild(pg);
  }

  // Bridge plugs
  if(!hid.has('bridgePlugs')){
    const bg=el('g',{});
    W.bridgePlugs.forEach((bp,i)=>{
      const y=d2y(bp.depth),cx=BCX,sz=10;
      const dm=el('polygon',{points:`${cx},${y-sz} ${cx+sz},${y} ${cx},${y+sz} ${cx-sz},${y}`,fill:'#cc6600',stroke:'#e68800','stroke-width':'1','data-t':'bridgePlug','data-i':String(i)});
      if(edit)dm.style.cursor='ns-resize';
      bg.appendChild(dm);
      addLbl('A',y,[{t:`Bridge plug · ${fmt(bp.depth)}`,s:7.5,f:'#cc6600',w:'600'}],{leader:cx+sz,lc:'#cc6600'});
    });
    g.appendChild(bg);
  }

  // Packers
  if(!hid.has('packers')){
    const pk=el('g',{});
    W.packers.forEach((p,i)=>{
      const y=d2y(p.depth),cx=BCX;
      pk.appendChild(el('polygon',{points:`${cx-8},${y-5} ${cx+8},${y-5} ${cx+3},${y} ${cx-3},${y}`,fill:'#6a5a8a',stroke:'#8a7aaa','stroke-width':'1','data-t':'packer','data-i':String(i)}));
      pk.appendChild(el('polygon',{points:`${cx-3},${y} ${cx+3},${y} ${cx+8},${y+5} ${cx-8},${y+5}`,fill:'#6a5a8a',stroke:'#8a7aaa','stroke-width':'1'}));
      addLbl('A',y,[{t:`Packer · ${fmt(p.depth)}`,s:7.5,f:'#8a7aaa',w:'600'}],{leader:cx+8,lc:'#8a7aaa'});
    });
    g.appendChild(pk);
  }

  // Perforations
  if(!hid.has('perforations')){
    const prg=el('g',{});
    W.perforations.forEach((p,i)=>{
      const y1=d2y(p.top),y2=d2y(p.bottom);
      const px1=BCX-iw/2-3,px2=BCX+iw/2+3;
      for(let y=y1;y<=y2;y+=4){prg.appendChild(el('line',{x1:px1-6,y1:y,x2:px1,y2:y,stroke:'#ff4444','stroke-width':'1.5','stroke-linecap':'round'}))}
      for(let y=y1;y<=y2;y+=4){prg.appendChild(el('line',{x1:px2,y1:y,x2:px2+6,y2:y,stroke:'#ff4444','stroke-width':'1.5','stroke-linecap':'round'}))}
      const zr=el('rect',{x:BCX-iw/2,y:y1-1,width:iw,height:Math.max(y2-y1,2)+2,fill:'#ff4444',opacity:'.12',rx:'1','data-t':'perf','data-i':String(i)});
      if(edit)zr.style.cursor='ns-resize';
      prg.appendChild(zr);
      addLbl('A',y1+(y2-y1)/2,[{t:`Perfs · ${fmt(p.top)}–${fmt(p.bottom)}`,s:7.5,f:'#ff4444',w:'600'}],{leader:px2+6,lc:'#ff4444'});
    });
    g.appendChild(prg);
  }

  // Drill stem tests (bracket on the left wall, faint band across the bore)
  if(!hid.has('dsts')){
    const dg=el('g',{});
    const bx=BCX-BW/2-5;
    W.dsts.forEach((d,i)=>{
      const y1=d2y(d.top),hh=Math.max(d2y(d.bottom)-y1,1.5);
      dg.appendChild(el('rect',{x:BCX-BW/2,y:y1,width:BW,height:hh,fill:'#00b8ff',opacity:'.12','pointer-events':'none'}));
      dg.appendChild(el('line',{x1:bx,y1:y1,x2:bx,y2:y1+hh,stroke:'#00b8ff','stroke-width':'1.5'}));
      dg.appendChild(el('line',{x1:bx,y1:y1,x2:bx+4,y2:y1,stroke:'#00b8ff','stroke-width':'1.5'}));
      dg.appendChild(el('line',{x1:bx,y1:y1+hh,x2:bx+4,y2:y1+hh,stroke:'#00b8ff','stroke-width':'1.5'}));
      const hit=el('rect',{x:bx-4,y:y1-3,width:10,height:hh+6,fill:'#00b8ff','fill-opacity':'0','data-t':'dst','data-i':String(i)});
      if(edit)hit.style.cursor='ns-resize';
      dg.appendChild(hit);
      addLbl('L',y1+hh/2,[{t:`DST #${d.id} · ${fmtS(d.top)}–${fmtS(d.bottom)}${uN()}`,s:7.5,f:'#00b8ff',w:'600'},{t:trunc(d.recovery||'recovery n/r',50),s:6.5,f:'#3a8aa8'}],{leader:bx-1,lc:'#00b8ff'});
    });
    g.appendChild(dg);
  }

  // Formations
  if(!hid.has('formations')){
    const fg=el('g',{});
    W.formations.forEach(f=>{
      const y=d2y(f.depth);
      fg.appendChild(el('line',{x1:BCX+BW/2+2,y1:y,x2:BCX+BW/2+9,y2:y,stroke:'#e6a817','stroke-width':'.75',opacity:'.7'}));
      fg.appendChild(el('line',{x1:RX+86,y1:y,x2:SW-20,y2:y,stroke:'#e6a817','stroke-width':'.75','stroke-dasharray':'4,3',opacity:'.5'}));
      addLbl('B',y,[{t:f.name,s:7.5,f:'#e6a817',w:'500'},{t:fmtS(f.depth)+uN(),s:6.5,f:'#b88a10'}],{leader:SW-20,lc:'#e6a817'});
    });
    g.appendChild(fg);
  }

  // Surface + TD
  if(!hid.has('surface')){
    const sg=el('g',{});const sy=d2y(0);
    sg.appendChild(el('line',{x1:BCX-BW/2-10,y1:sy,x2:BCX+BW/2+5,y2:sy,stroke:'#fff','stroke-width':'2.5'}));
    const sl=el('text',{x:LX,y:sy-6,'text-anchor':'end',fill:'#fff','font-size':'8.5','font-weight':'600','font-family':FD});sl.textContent='Ground Surface';sg.appendChild(sl);
    if(W.kbElevation){sg.appendChild(el('polygon',{points:`${AX-15},${sy-5} ${AX-10},${sy} ${AX-15},${sy+5}`,fill:'#f7c948',stroke:'#f7c948','stroke-width':'1'}));
      const kl=el('text',{x:AX-20,y:sy-8,'text-anchor':'end',fill:'#f7c948','font-size':'7','font-weight':'500','font-family':FB});kl.textContent=`KB ${fmtS(W.kbElevation)}${uN()}`;sg.appendChild(kl)}
    g.appendChild(sg);
    const ty=d2y(W.totalDepth);
    g.appendChild(el('line',{x1:BCX-BW/2-10,y1:ty,x2:BCX+BW/2+5,y2:ty,stroke:'#ff6b6b','stroke-width':'1','stroke-dasharray':'6,3'}));
    addLbl('L',ty+10,[{t:`TD — ${fmt(W.totalDepth)}`,s:8,f:'#ff6b6b',w:'600',ff:FD}]);
  }

  // Surface cut-off and cap (abandonment)
  if(!hid.has('surfaceCut')&&W.surfaceCut){
    const y=d2y(W.surfaceCut.depth),sg2=el('g',{});
    sg2.appendChild(el('rect',{x:BCX-BW/2-3,y:y-1,width:BW+6,height:3.5,fill:'#c8d0d0',stroke:'#e8f0f0','stroke-width':'.5',rx:'1'}));
    addLbl('A',y+4,[{t:trunc(W.surfaceCut.label||'Casing cut & capped',56),s:7,f:'#c8d0d0',w:'600'}],{leader:BCX+BW/2+3,lc:'#c8d0d0'});
    g.appendChild(sg2);
  }

  drawLbls(g);
  svg.appendChild(g);
  bindEvents();
}

// ═══════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════
function bindEvents(){
  document.querySelectorAll('[data-t]').forEach(e=>{
    e.addEventListener('mouseenter',onHov);
    e.addEventListener('mousemove',onMv);
    e.addEventListener('mouseleave',onLv);
    e.addEventListener('click',onClick);
    if(edit)e.addEventListener('mousedown',onDragStart);
  });
}

function onHov(ev){if(drag)return;const e=ev.currentTarget,t=e.getAttribute('data-t'),i=+e.getAttribute('data-i');const d=tipData(t,i);showTip(d.t,d.b);e.style.filter='brightness(1.4)'}
function onMv(ev){posTip(ev.clientX,ev.clientY)}
function onLv(ev){ev.currentTarget.style.filter='';hideTip()}

function onClick(ev){
  ev.preventDefault();ev.stopPropagation();
  const e=ev.currentTarget,t=e.getAttribute('data-t'),i=+e.getAttribute('data-i');
  selObj={t,i};
  // Open property panel
  document.getElementById('ppnl').classList.add('vis');
  showProps(t,i);
  // Show detail
  const d=tipData(t,i);showDetail(d.t,d.b,d.n||'');
  // Highlight
  document.querySelectorAll('[data-t]').forEach(e=>e.style.outline='');
  e.style.outline='2px solid var(--accent3)';
  // Scroll property panel into view
  document.getElementById('ppnl').scrollIntoView({behavior:'smooth',block:'nearest'});
  renderCmgr();
}

// ═══════════════════════════════════════
// DRAG
// ═══════════════════════════════════════
function onDragStart(ev){
  if(!edit)return;
  ev.preventDefault();ev.stopPropagation();
  const e=ev.currentTarget,t=e.getAttribute('data-t'),i=+e.getAttribute('data-i');
  drag={t,i,sy:ev.clientY,od:getDepth(t,i)};
  document.addEventListener('mousemove',onDragMv);
  document.addEventListener('mouseup',onDragEnd);
}
function onDragMv(ev){
  if(!drag)return;
  const dy=ev.clientY-drag.sy;
  const ch=document.getElementById('svgbox').clientHeight;
  const dd=(dy/ch)*(W.totalDepth/sc);
  let nd=Math.max(0,Math.min(W.totalDepth,drag.od+dd));
  setDepth(drag.t,drag.i,nd);
  render();renderCmgr();
}
function onDragEnd(){
  document.removeEventListener('mousemove',onDragMv);
  document.removeEventListener('mouseup',onDragEnd);
  if(drag&&selObj&&selObj.t===drag.t&&selObj.i===drag.i)showProps(drag.t,drag.i);
  drag=null;saveW();renderStats();renderFmgr();
}

function getDepth(t,i){
  switch(t){
    case'casing':return W.casings[i].shoe;
    case'plug':return(W.plugs[i].top+W.plugs[i].bottom)/2;
    case'bridgePlug':return W.bridgePlugs[i].depth;
    case'packer':return W.packers[i].depth;
    case'perf':return(W.perforations[i].top+W.perforations[i].bottom)/2;
    case'dst':return(W.dsts[i].top+W.dsts[i].bottom)/2;
    default:return 0;
  }
}
function setDepth(t,i,d){
  switch(t){
    case'casing':{const c=W.casings[i],sp=c.shoe-c.top;c.shoe=d;c.top=Math.max(0,d-sp);break}
    case'plug':{const p=W.plugs[i],h=p.top-p.bottom;p.top=d+h/2;p.bottom=d-h/2;break}
    case'bridgePlug':W.bridgePlugs[i].depth=d;break;
    case'packer':W.packers[i].depth=d;break;
    case'perf':{const p=W.perforations[i],h=p.bottom-p.top;p.top=d-h/2;p.bottom=d+h/2;break}
    case'dst':{const p=W.dsts[i],h=p.bottom-p.top;p.top=d-h/2;p.bottom=d+h/2;break}
  }
}

// ═══════════════════════════════════════
// PROPERTY EDITOR
// ═══════════════════════════════════════
const ARR={casing:'casings',plug:'plugs',bridgePlug:'bridgePlugs',packer:'packers',perf:'perforations',dst:'dsts'};
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function showProps(t,i){
  const d=W;let fields=[],title='';
  const o=d[ARR[t]][i];
  switch(t){
    case'casing':title=o.name;fields=[{k:'name',l:'Name',v:o.name},{k:'od',l:'OD',v:o.od},{k:'grade',l:'Grade',v:o.grade},{k:'weight',l:'Weight',v:o.weight},{k:'top',l:'Top (m)',v:o.top,n:1},{k:'shoe',l:'Shoe (m)',v:o.shoe,n:1},{k:'cementTop',l:'Cement Top (m)',v:o.cementTop,n:1},{k:'cement',l:'Cement',v:o.cement||''}];break;
    case'plug':title=`Plug #${o.id}`;fields=[{k:'id',l:'ID',v:o.id,n:1},{k:'bottom',l:'Top (m)',v:o.bottom,n:1},{k:'top',l:'Base (m)',v:o.top,n:1},{k:'sacks',l:'Sacks',v:o.sacks==null?'':o.sacks,n:1},{k:'additive',l:'Additive',v:o.additive},{k:'date',l:'Date',v:o.date||''},{k:'notes',l:'Notes',v:o.notes,a:1}];break;
    case'bridgePlug':title='Bridge Plug';fields=[{k:'depth',l:'Depth (m)',v:o.depth,n:1},{k:'type',l:'Type',v:o.type}];break;
    case'packer':title='Packer';fields=[{k:'depth',l:'Depth (m)',v:o.depth,n:1},{k:'type',l:'Type',v:o.type}];break;
    case'perf':title='Perforation';fields=[{k:'top',l:'Top (m)',v:o.top,n:1},{k:'bottom',l:'Bottom (m)',v:o.bottom,n:1},{k:'notes',l:'Notes',v:o.notes||'',a:1}];break;
    case'dst':title=`DST #${o.id}`;fields=[{k:'id',l:'ID',v:o.id,n:1},{k:'top',l:'Top (m)',v:o.top,n:1},{k:'bottom',l:'Bottom (m)',v:o.bottom,n:1},{k:'recovery',l:'Recovery',v:o.recovery||''},{k:'notes',l:'Notes',v:o.notes||'',a:1}];break;
  }
  document.getElementById('ptitle').textContent='✎ '+title;
  document.getElementById('pfields').innerHTML=fields.map(f=>{
    if(f.a)return`<div class="pf"><label>${f.l}</label><textarea onchange="updProp('${t}',${i},'${f.k}',this.value)">${esc(f.v)}</textarea></div>`;
    if(f.n)return`<div class="pf"><label>${f.l}</label><input type="number" step="any" value="${esc(f.v)}" onchange="updProp('${t}',${i},'${f.k}',this.value)"></div>`;
    return`<div class="pf"><label>${f.l}</label><input type="text" value="${esc(f.v)}" onchange="updProp('${t}',${i},'${f.k}',this.value)"></div>`;
  }).join('');
  document.getElementById('pacts').innerHTML=`<button class="pab del" onclick="delObj('${t}',${i})">✕ Delete</button><button class="pab" onclick="dupObj('${t}',${i})">⧉ Duplicate</button>`;
}

function updProp(t,i,k,v){
  const o=W[ARR[t]][i];
  o[k]=['top','bottom','shoe','depth','cementTop','sacks','id'].includes(k)?parseFloat(v)||0:v;
  saveW();render();renderStats();showProps(t,i);
}

function delObj(t,i){
  W[ARR[t]].splice(i,1);deselect();saveW();render();renderStats();renderCmgr();
}

function dupObj(t,i){
  const arr=ARR[t];
  const c=JSON.parse(JSON.stringify(W[arr][i]));
  if(c.depth!=undefined)c.depth+=50;if(c.top!=undefined){c.top+=20;c.bottom+=20}
  if(c.shoe!=undefined)c.shoe+=50;
  W[arr].splice(i+1,0,c);saveW();render();renderStats();renderCmgr();
}

function deselect(){
  selObj=null;
  document.getElementById('ppnl').classList.remove('vis');
  document.querySelectorAll('[data-t]').forEach(e=>e.style.outline='');
  document.getElementById('dempty').style.display='';
  document.getElementById('dcont').style.display='none';
  renderCmgr();renderFmgr();
}

// ═══════════════════════════════════════
// COMPONENT MANAGER
// ═══════════════════════════════════════
function renderCmgr(){
  const d=W;
  const gs=[
    {l:'Casings',t:'casing',c:'#8a9a9a',items:d.casings.map((c,i)=>({n:c.name,d:fmtS(c.shoe)+(unit==='m'?' m':' ft'),i}))},
    {l:'Cement Plugs',t:'plug',c:'#2d7a4f',items:d.plugs.map((p,i)=>({n:`Plug #${p.id}`,d:fmtS(p.top)+(unit==='m'?' m':' ft'),i}))},
    {l:'Bridge Plugs',t:'bridgePlug',c:'#cc6600',items:d.bridgePlugs.map((bp,i)=>({n:bp.type,d:fmtS(bp.depth)+(unit==='m'?' m':' ft'),i}))},
    {l:'Packers',t:'packer',c:'#6a5a8a',items:d.packers.map((p,i)=>({n:p.type,d:fmtS(p.depth)+(unit==='m'?' m':' ft'),i}))},
    {l:'Perforations',t:'perf',c:'#ff4444',items:d.perforations.map((p,i)=>({n:`${fmtS(p.top)}–${fmtS(p.bottom)}${uN()}`,d:'',i}))},
    {l:'DSTs',t:'dst',c:'#00b8ff',items:d.dsts.map((x,i)=>({n:`DST #${x.id}`,d:`${fmtS(x.top)}–${fmtS(x.bottom)}${uN()}`,i}))},
    {l:'Formations',t:'formation',c:'#e6a817',items:d.formations.map((f,i)=>({n:f.name,d:fmtS(f.depth)+(unit==='m'?' m':' ft'),i}))}
  ];
  document.getElementById('chint').textContent=edit?'(click to edit · drag to move)':'';
  document.getElementById('cmgr').innerHTML=gs.map(g=>{
    const items=g.items.map(it=>{
      const sel=selObj&&selObj.t===g.t&&selObj.i===it.i?' sel':'';
      return`<div class="ci${sel}" onclick="selFromList('${g.t}',${it.i})"><div class="sw" style="background:${g.c}"></div><span class="nm">${it.n}</span><span class="dp">${it.d}</span></div>`;
    }).join('');
    const ab=edit?`<button class="addb" onclick="addObj('${g.t}')">+ Add</button>`:'';
    return`<div class="csec">${g.l} (${g.items.length})</div><div class="clist">${items||'<div style="font-size:.6rem;color:var(--text-dim);padding:.15rem .3rem;font-style:italic">None</div>'}</div>${ab}`;
  }).join('');
}

function selFromList(t,i){
  selObj={t,i};
  document.getElementById('ppnl').classList.add('vis');
  showProps(t,i);
  const d=tipData(t,i);showDetail(d.t,d.b,d.n||'');
  document.querySelectorAll('[data-t]').forEach(e=>e.style.outline='');
  const el=document.querySelector(`[data-t="${t}"][data-i="${i}"]`);
  if(el){el.style.outline='2px solid var(--accent3)';el.scrollIntoView({behavior:'smooth',block:'center'})}
  document.getElementById('ppnl').scrollIntoView({behavior:'smooth',block:'nearest'});
  renderCmgr();renderFmgr();
}

function addObj(t){
  const d=W;

function renderFmgr(){
  const fs=W.formations;
  document.getElementById('fhint').textContent=fs.length?`(${fs.length} layers)`:'';
  let html='';
  fs.forEach((f,i)=>{
    html+=`<div class="frow" data-fi="${i}">
      <div class="fm" style="background:#e6a817" title="Drag to reorder"></div>
      <div class="fn"><input type="text" value="${esc(f.name)}" onchange="updForm(${i},'name',this.value)" placeholder="Formation name"></div>
      <div class="fd"><input type="number" step="any" value="${f.depth}" onchange="updForm(${i},'depth',this.value)" title="Depth"></div>
      <div class="fu">${unit==='m'?'m':'ft'}</div>
      <button class="fb dup" onclick="dupForm(${i})" title="Duplicate">⧉</button>
      <button class="fb" onclick="delForm(${i})" title="Delete">✕</button>
    </div>`;
  });
  html+=`<div class="fadd">
    <input type="text" id="fnew-name" placeholder="Formation name">
    <input type="number" step="any" id="fnew-depth" placeholder="Depth" style="width:60px">
    <button onclick="addForm()">+ Add</button>
  </div>
  <div class="fhint">Click name/depth to edit · drag handle to reorder · Enter to add</div>`;
  document.getElementById('fmgr').innerHTML=html;

  // Enable drag reorder
  const rows=document.querySelectorAll('.frow');
  rows.forEach(row=>{
    const handle=row.querySelector('.fm');
    handle.addEventListener('mousedown',e=>startFdrag(e,row));
  });

  // Enter key on new formation inputs
  const ni=document.getElementById('fnew-name');
  const di=document.getElementById('fnew-depth');
  if(di)di.addEventListener('keydown',e=>{if(e.key==='Enter')addForm()});
  if(ni)ni.addEventListener('keydown',e=>{if(e.key==='Enter')addForm()});
}

function updForm(i,k,v){
  if(k==='depth')W.formations[i].depth=parseFloat(v)||0;
  else W.formations[i].name=v;

}

function addForm(){
  const n=document.getElementById('fnew-name');
  const d=document.getElementById('fnew-depth');
  const name=n.value.trim()||`Formation ${W.formations.length+1}`;
  const depth=parseFloat(d.value)||W.totalDepth*.5;
  W.formations.push({name,depth});
  W.formations.sort((a,b)=>a.depth-b.depth);
  n.value='';d.value='';
  saveW();render();renderStats();renderFmgr();
}

function delForm(i){
  W.formations.splice(i,1);

function dupForm(i){

  c.depth+=50;
  W.formations.splice(i+1,0,c);

// Drag reorder for formations
let fdrag=null;
function startFdrag(e,row){
  e.preventDefault();
  const fi=+row.getAttribute('data-fi');
  const rect=row.getBoundingClientRect();
  const ghost=row.cloneNode(true);
  ghost.classList.add('fdrag');
  ghost.style.width=rect.width+'px';
  document.body.appendChild(ghost);
  fdrag={fi,ghost,row,sy:e.clientY,oy:rect.top};

  const onMove=ev=>{
    if(!fdrag)return;
    fdrag.ghost.style.top=(ev.clientY-10)+'px';
    fdrag.ghost.style.left=rect.left+'px';
    // Find target position
    const rows=document.querySelectorAll('.frow');
    rows.forEach(r=>{
      const rr=r.getBoundingClientRect();
      if(ev.clientY>rr.top&&ev.clientY<rr.bottom){
        r.style.borderTop='2px solid var(--accent3)';
      }else{
        r.style.borderTop='';
      }
    });
  };
  const onUp=ev=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    if(fdrag){
      fdrag.ghost.remove();
      // Find drop target
      const rows=document.querySelectorAll('.frow');
      let target=-1;
      rows.forEach(r=>{
        r.style.borderTop='';
        const rr=r.getBoundingClientRect();
        if(ev.clientY>rr.top&&ev.clientY<rr.bottom)target=+r.getAttribute('data-fi');
      });
      if(target>=0&&target!==fdrag.fi){
        const item=W.formations.splice(fdrag.fi,1)[0];
        W.formations.splice(target,0,item);
        saveW();render();renderStats();renderFmgr();
      }
      fdrag=null;
    }
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function renderStats(){
  const d=W;
  const tp=d.plugs.reduce((s,p)=>s+(p.top-p.bottom),0);
  const pc=d.totalDepth>0?((tp/d.totalDepth)*100).toFixed(1):'0.0';
  const oh=d.casings.length>0?d.totalDepth-d.casings[d.casings.length-1].shoe:d.totalDepth;
  const dp=d.plugs.length>0?Math.max(...d.plugs.map(p=>p.top)):0;
  const sp=d.plugs.length>0?Math.min(...d.plugs.map(p=>p.bottom)):0;
  const lp=d.plugs.length>0?Math.max(...d.plugs.map(p=>p.top-p.bottom)):0;
  const fs=[
    {k:'wellId',l:'Well ID',v:d.wellId,t:'text'},
    {k:'operator',l:'Operator',v:d.operator,t:'text'},
    {k:'totalDepth',l:'Total Depth (m)',v:d.totalDepth,t:'number'},
    {k:'kbElevation',l:'KB Elevation (m)',v:d.kbElevation||'',t:'number'},
    {s:'Construction'},
    {r:'Casing Strings',v:d.casings.length},{r:'Cement Plugs',v:d.plugs.length},{r:'Bridge Plugs',v:d.bridgePlugs.length},{r:'Packers',v:d.packers.length},
    {s:'Plug Analysis'},
    {r:'Deepest Plug',v:d.plugs.length>0?fmt(dp):'—'},{r:'Shallowest Plug',v:d.plugs.length>0?fmt(sp):'—'},{r:'Longest Plug',v:d.plugs.length>0?fmt(lp):'—'},
    {r:'Total Plugged',v:fmt(tp)},{r:'Coverage',v:pc+'%'},{r:'Open Hole',v:fmt(oh)},
    {s:'Completion & Testing'},{r:'Perforations',v:d.perforations.length},{r:'DST Intervals',v:d.dsts.length},{r:'Formations',v:d.formations.length}
  ];
  document.getElementById('stats').innerHTML=fs.map(f=>{
    if(f.s)return`<div class="ssec">${f.s}</div>`;
    if(f.r)return`<div class="sr"><span class="sl">${f.r}</span><span class="sv">${f.v}</span></div>`;
    return`<div class="sr"><span class="sl">${f.l}</span><input class="si${f.t==='text'?' si-t':''}" type="${f.t}" value="${esc(f.v)}" onchange="updStat('${f.k}',this.value)" onfocus="this.select()"></div>`;
  }).join('');
}
function updStat(k,v){
  if(k==='wellId')W.wellId=v;
  else if(k==='operator'){W.operator=v;updHdr()}
  else if(k==='totalDepth')W.totalDepth=Math.max(1,parseFloat(v)||1000);
  else if(k==='kbElevation')W.kbElevation=v?parseFloat(v):null;
  saveW();render();renderStats();renderCmgr();renderFmgr();
}

const ZMN=.5,ZMX=5,ZS=.15;

function initZP(){
  const c=document.getElementById('svgbox');
  c.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(ZMN,Math.min(ZMX,e.deltaY>0?sc*.92:sc*1.08));updT();updZ()},{passive:false});
  c.addEventListener('mousedown',e=>{if(e.target.closest('[data-t]'))return;pan=true;ps={x:e.clientX-px,y:e.clientY-py};c.style.cursor='grabbing'});
  window.addEventListener('mousemove',e=>{if(!pan)return;px=e.clientX-ps.x;py=e.clientY-ps.y;updT()});
  window.addEventListener('mouseup',()=>{pan=false;document.getElementById('svgbox').style.cursor=edit?'crosshair':'grab'});
  c.addEventListener('dblclick',()=>zoomReset());
  let ltd=0;
  c.addEventListener('touchstart',e=>{if(e.touches.length===1){pan=true;ps={x:e.touches[0].clientX-px,y:e.touches[0].clientY-py}}else if(e.touches.length===2)ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
  c.addEventListener('touchmove',e=>{if(e.touches.length===1&&pan){px=e.touches[0].clientX-ps.x;py=e.touches[0].clientY-ps.y;updT()}else if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(ltd>0){sc=Math.max(ZMN,Math.min(ZMX,sc*(d2/ltd)));updT();updZ()}ltd=d2}},{passive:true});
  c.addEventListener('touchend',()=>{pan=false;ltd=0});
}

function expPNG(){
  const svg=document.getElementById('svg');
  const h=sh();
  // Set explicit dimensions for rasterization
  svg.setAttribute('width',SW);
  svg.setAttribute('height',h);
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const sd=new XMLSerializer().serializeToString(svg);
  // Remove explicit dims after serialization
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.removeAttribute('xmlns');
  const sb=new Blob([sd],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(sb);
  const cv=document.createElement('canvas');
  const s=3;
  cv.width=SW*s;cv.height=h*s;
  const ctx=cv.getContext('2d');
  ctx.scale(s,s);
  const img=new Image();
  img.onload=()=>{
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,SW,h);
    ctx.drawImage(img,0,0,SW,h);
    cv.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`wellbore-${W.wellId}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    },'image/png');
    URL.revokeObjectURL(url);
  };
  img.src=url;
}
function expSVG(){
  const svg=document.getElementById('svg');
  const clone=svg.cloneNode(true);
  const h=sh();
  clone.setAttribute('width',SW);
  clone.setAttribute('height',h);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  // Add white background rect for clean export
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width',SW);bg.setAttribute('height',h);bg.setAttribute('fill','#ffffff');
  clone.insertBefore(bg,clone.firstChild);
  // Fix text colors for light background
  clone.querySelectorAll('text').forEach(t=>{
    const fill=t.getAttribute('fill');
    if(fill==='#8fa8a8')t.setAttribute('fill','#555555');
    if(fill==='#6a8888')t.setAttribute('fill','#666666');
    if(fill==='#fff')t.setAttribute('fill','#000000');
    if(fill==='#e6a817')t.setAttribute('fill','#b8860b');
    if(fill==='#b88a10')t.setAttribute('fill','#8b6914');
    if(fill==='#00b8ff'||fill==='#3a8aa8')t.setAttribute('fill','#0277bd');
    if(fill==='#c8d0d0')t.setAttribute('fill','#555555');
  });
  // Fix line colors
  clone.querySelectorAll('line').forEach(l=>{
    const stroke=l.getAttribute('stroke');
    if(stroke==='#3a5a5a')l.setAttribute('stroke','#999999');
    if(stroke==='#6a8a8a')l.setAttribute('stroke','#777777');
    if(stroke==='#fff')l.setAttribute('stroke','#000000');
    if(stroke==='#ff6b6b')l.setAttribute('stroke','#cc0000');
    if(stroke==='#00b8ff')l.setAttribute('stroke','#0277bd');
    if(stroke==='#c8d0d0')l.setAttribute('stroke','#777777');
  });
  const sd=new XMLSerializer().serializeToString(clone);
  const b=new Blob([sd],{type:'image/svg+xml;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`wellbore-${W.wellId}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// PRINT PREPARATION
// ═══════════════════════════════════════
let printColors=[];
window.addEventListener('beforeprint',()=>{
  // Save and fix SVG colors for print
  const svg=document.getElementById('svg');
  const bg=svg.querySelector('rect');
  if(bg){printColors.push({el:bg,fill:bg.getAttribute('fill')});bg.setAttribute('fill','#ffffff')}
  svg.querySelectorAll('text').forEach(t=>{
    const f=t.getAttribute('fill');
    if(f==='#fff'||f==='#ffffff'){printColors.push({el:t,fill:f});t.setAttribute('fill','#000000')}
    if(f==='#8fa8a8'){printColors.push({el:t,fill:f});t.setAttribute('fill','#555555')}
    if(f==='#6a8888'){printColors.push({el:t,fill:f});t.setAttribute('fill','#666666')}
    if(f==='#e6a817'){printColors.push({el:t,fill:f});t.setAttribute('fill','#b8860b')}
    if(f==='#b88a10'){printColors.push({el:t,fill:f});t.setAttribute('fill','#8b6914')}
    if(f==='#4aba7a'||f==='#2d7a4f'){printColors.push({el:t,fill:f});t.setAttribute('fill','#2e7d32')}
    if(f==='#cc6600'){printColors.push({el:t,fill:f});t.setAttribute('fill','#bf5b00')}
    if(f==='#8a7aaa'){printColors.push({el:t,fill:f});t.setAttribute('fill','#6a5a8a')}
    if(f==='#ff4444'){printColors.push({el:t,fill:f});t.setAttribute('fill','#cc0000')}
    if(f==='#3a8a5a'||f==='#2d6a4f'){printColors.push({el:t,fill:f});t.setAttribute('fill','#1b5e20')}
    if(f==='#00b8ff'||f==='#3a8aa8'){printColors.push({el:t,fill:f});t.setAttribute('fill','#0277bd')}
    if(f==='#c8d0d0'){printColors.push({el:t,fill:f});t.setAttribute('fill','#555555')}
  });
  svg.querySelectorAll('line').forEach(l=>{
    const s=l.getAttribute('stroke');
    if(s==='#3a5a5a'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#aaaaaa')}
    if(s==='#6a8a8a'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#888888')}
    if(s==='#fff'||s==='#ffffff'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#000000')}
    if(s==='#ff6b6b'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#cc0000')}
    if(s==='#4a9ebb'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#2196f3')}
    if(s==='#00b8ff'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#0277bd')}
    if(s==='#c8d0d0'){printColors.push({el:l,stroke:s});l.setAttribute('stroke','#777777')}
  });
  svg.querySelectorAll('rect,polygon').forEach(r=>{
    const f=r.getAttribute('fill');
    if(f&&f!=='none'&&f!=='url(#ohP)'){
      if(f==='#5a6a6a'||f==='#8a9a9a'){printColors.push({el:r,fill:f});r.setAttribute('fill','#9e9e9e')}
      if(f==='#4a9ebb'){printColors.push({el:r,fill:f});r.setAttribute('fill','#64b5f6')}
      if(f==='#2d7a4f'){printColors.push({el:r,fill:f});r.setAttribute('fill','#66bb6a')}
      if(f==='#cc6600'){printColors.push({el:r,fill:f});r.setAttribute('fill','#ff9800')}
      if(f==='#6a5a8a'){printColors.push({el:r,fill:f});r.setAttribute('fill','#9575cd')}
      if(f==='#ff4444'){printColors.push({el:r,fill:f});r.setAttribute('fill','#ef9a9a')}
      if(f==='#0a1414'){printColors.push({el:r,fill:f});r.setAttribute('fill','#f5f5f5')}
      if(f==='#c8d0d0'){printColors.push({el:r,fill:f});r.setAttribute('fill','#9e9e9e')}
      if(f==='url(#ohP)'){printColors.push({el:r,fill:f});r.setAttribute('fill','#d7ccc8')}
    }
  });
  // Fix SVG container background
  const box=document.getElementById('svgbox');
  box.style.background='#fff';
  box.style.boxShadow='none';
});
window.addEventListener('afterprint',()=>{
  // Restore all saved colors
  printColors.forEach(c=>{
    if(c.fill)c.el.setAttribute('fill',c.fill);
    if(c.stroke)c.el.setAttribute('stroke',c.stroke);
  });
  printColors=[];
  document.getElementById('svgbox').style.background='';
  document.getElementById('svgbox').style.boxShadow='';
});
